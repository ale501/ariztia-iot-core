version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_ariztia
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ariztia_db
      - POSTGRES_USER=ariztia
      - POSTGRES_PASSWORD=ariztia_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ariztia_app:
    build: .
    container_name: ariztia_monitoreo
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-docker.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ariztia_app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
      - prometheus

volumes:
  postgres_data:
  grafana_data:
