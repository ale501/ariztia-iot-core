<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de proyectos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>Iniciar sesión</h1>
    <div class="subtitle">Panel de proyectos — Ariztía / Tracking</div>

    <div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div>

    <form id="loginForm">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required value="admin">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" required value="admin">
      </div>
      <button type="submit">Ingresar</button>
    </form>

    <div class="login-hint">Credenciales: usuario <code>admin</code> / clave <code>admin</code></div>
  </div>
</div>

<script>
  const USUARIO_DEMO = 'admin';
  const CLAVE_DEMO = 'admin';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value.trim();

    if (usuario === USUARIO_DEMO && clave === CLAVE_DEMO) {
      // Guardar en ambos almacenamientos para máxima compatibilidad
      try { localStorage.setItem('sesionActiva', 'true'); } catch (err) {}
      try { sessionStorage.setItem('sesionActiva', 'true'); } catch (err) {}
      
      window.location.href = 'menu.html';
    } else {
      errorBox.classList.add('visible');
    }
  });
</script>

</body>
</html>
